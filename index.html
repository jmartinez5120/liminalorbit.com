<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liminal Orbit</title>
<style>
html,body{margin:0;height:100%;background:#0b0d10;color:#cfe8ef;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.orbit{width:120px;height:120px;border:1px solid #1fd1e0;border-radius:50%;position:relative;margin-bottom:32px;box-shadow:0 0 40px #1fd1e033}
.orbit:after{content:'';position:absolute;width:10px;height:10px;background:#f5a524;border-radius:50%;top:-5px;left:55px;box-shadow:0 0 12px #f5a524}
h1{font-weight:300;letter-spacing:.3em;text-transform:uppercase;margin:0}
p{color:#6f8a93;letter-spacing:.1em}
</style>
</head>
<body>
<main>
<div class="orbit"></div>
<h1>Liminal Orbit</h1>
<p>Coming soon</p>
</main>
</body>
</html>
